version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: bhusetu-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    entrypoint: >
      /bin/sh -c "
      minio server /data --console-address ':9001' &
      PID=$$!;
      echo 'Waiting for MinIO server to initialize...';
      until curl -s http://localhost:9000/minio/health/live; do
        sleep 1;
      done;
      echo 'MinIO is live. Provisioning bucket land-aquisition-docs...';
      if command -v mc > /dev/null 2>&1; then
        mc alias set local http://localhost:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/land-aquisition-docs;
      else
        mkdir -p /data/land-aquisition-docs;
      fi;
      echo 'Bucket provisioned successfully.';
      wait $$PID
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  minio_data:
    driver: local
